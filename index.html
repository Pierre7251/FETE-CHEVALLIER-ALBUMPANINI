<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fête Chevallier - Album Panini</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f1ea;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    color: #333;
    font-size: 32px;
}

h2 {
    text-align: center;
    margin: 5px 0 25px;
    color: #555;
    font-size: 22px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    color: #777;
}


/* ============================================================
   NAVIGATION
============================================================ */

.navigation {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

.tab {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    background: #ddd;
    color: #333;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.tab:hover {
    background: #c8c8c8;
    transform: translateY(-1px);
}

.tab.active {
    background: #333;
    color: white;
}


/* ============================================================
   BOUTONS RETOUR
============================================================ */

.back-button {
    display: block;
    margin: 0 auto 25px;
    border: none;
    background: #555;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.back-button:hover {
    background: #333;
}


/* ============================================================
   PAGE D'ACCUEIL
============================================================ */

.home-families {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    max-width: 900px;
    margin: 30px auto;
}

.home-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: 0.25s;
    text-align: center;
}

.home-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.18);
}

.home-card h2 {
    margin-top: 10px;
    margin-bottom: 15px;
}

.home-card img {
    width: 100%;
    height: 350px;
    object-fit: contain;
    border-radius: 10px;
    background: #f5f5f5;
}


/* ============================================================
   LISTE DES FAMILLES
============================================================ */

.family-selection {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    max-width: 1000px;
    margin: 0 auto;
}

.family-button {
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.family-button:hover {
    border-color: #555;
    background: #fafafa;
    transform: translateY(-2px);
}


/* ============================================================
   PHOTOS
============================================================ */

.photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
    margin-top: 25px;
}

.photo-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-align: center;
    overflow: hidden;
}


/* ============================================================
   PHOTO VERROUILLEE
   IMPORTANT :
   Ce n'est PAS un bouton.
   Il n'y a donc AUCUN clic possible.
============================================================ */

.discover-card {
    width: 100%;
    height: 320px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #ddd, #f7f7f7);

    display: flex;
    align-items: center;
    justify-content: center;

    color: #555;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    padding: 20px;

    cursor: default;
    user-select: none;
}


/* Pas de hover sur une photo verrouillée */

.discover-card:hover {
    transform: none;
    background: linear-gradient(135deg, #ddd, #f7f7f7);
}

.discover-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.discover-icon {
    font-size: 48px;
}

.discover-text {
    font-size: 20px;
    line-height: 1.3;
}


/* ============================================================
   PHOTO REVELEE
============================================================ */

.revealed-image {
    width: 100%;
    height: 320px;
    object-fit: contain;
    display: block;
    border-radius: 8px;
    background: #f5f5f5;

    /*
       IMPORTANT :
       aucune interaction avec l'image
    */
    pointer-events: none;
}


/* ============================================================
   NOM PHOTO
============================================================ */

.photo-name {
    margin-top: 12px;
    font-weight: bold;
    font-size: 17px;
}


/* ============================================================
   PHOTO MANQUANTE
============================================================ */

.image-error {
    height: 320px;
    background: #eee;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;
    color: #888;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 700px) {

    .container {
        padding: 12px;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 19px;
    }

    .home-families {
        grid-template-columns: 1fr;
    }

    .home-card img {
        height: 300px;
    }

    .photos {
        grid-template-columns: 1fr;
    }

    .revealed-image,
    .discover-card,
    .image-error {
        height: 350px;
    }

    .tab {
        width: 100%;
    }

    .navigation {
        flex-direction: column;
    }
}

</style>
</head>

/* ============================================================

const app = document.getElementById("app");


/* ============================================================
   MEMOIRE DES PHOTOS DECOUVERTES
============================================================ */

/*
   Nouvelle clé unique :

   branche + famille + personne + numéro de photo

   Exemple :

   chevallier_album_photo_deniseRaymond_raymonde_philippe_0
*/

function getPhotoKey(branchId, familyId, personId, photoIndex) {

    return (
        STORAGE_PREFIX +
        branchId + "_" +
        familyId + "_" +
        personId + "_" +
        photoIndex
    );
}


/* ============================================================
   VERIFIER SI UNE PHOTO EST DECOUVERTE
============================================================ */

function isPhotoDiscovered(
    branchId,
    familyId,
    personId,
    photoIndex
) {

    return localStorage.getItem(
        getPhotoKey(
            branchId,
            familyId,
            personId,
            photoIndex
        )
    ) === "true";
}


/* ============================================================
   ENREGISTRER UNE PHOTO DECOUVERTE
============================================================ */

function markPhotoDiscovered(
    branchId,
    familyId,
    personId,
    photoIndex
) {

    localStorage.setItem(
        getPhotoKey(
            branchId,
            familyId,
            personId,
            photoIndex
        ),
        "true"
    );
}

                    alt="Denise et Raymond"

            </div>

        </div>
    `;

/* ============================================================
   LISTE DES FAMILLES
============================================================ */

function showFamilyList(branchId) {

    const branch = album[branchId];

    if (!branch) {
        showHome();
        return;
    }

    let html = `

        <button
            class="back-button"
            onclick="showHome()"
        >
            ← Retour
        </button>

        <h1>${branch.title}</h1>

        <div class="subtitle">
            Choisissez une famille
        </div>

        <div class="family-selection">
    `;


    branch.families.forEach(family => {

        html += `

            <button
                class="family-button"
                onclick="showFamily(
                    '${branchId}',
                    '${family.id}'
                )"
            >

                ${family.name}

            </button>

        `;

    });


    html += `</div>`;

    app.innerHTML = html;
}


/* ============================================================
   AFFICHAGE D'UNE FAMILLE
============================================================ */

function showFamily(
    branchId,
    familyId,
    personId = null
) {

    const branch = album[branchId];

    if (!branch) {
        showHome();
        return;
    }


    const family = branch.families.find(
        item => item.id === familyId
    );


    if (!family) {
        showHome();
        return;
    }


    let html = `

        <button
            class="back-button"
            onclick="showFamilyList('${branchId}')"
        >
            ← Retour aux familles
        </button>

        <h1>${family.name}</h1>

        <div class="navigation">
    `;


    family.people.forEach(person => {

        html += `

            <button
                id="tab-${person.id}"
                class="tab"
                onclick="showPerson(
                    '${branchId}',
                    '${familyId}',
                    '${person.id}'
                )"
            >

                ${person.name}

            </button>

        `;

    });


    html += `</div>`;

    html += `<div id="personContent"></div>`;

    app.innerHTML = html;


    let selectedPersonId = family.people[0].id;


    if (personId) {

        const found = family.people.find(
            person => person.id === personId
        );


        if (found) {
            selectedPersonId = found.id;
        }
    }


    showPerson(
        branchId,
        familyId,
        selectedPersonId
    );
}


/* ============================================================
   AFFICHAGE D'UNE PERSONNE
============================================================ */

function showPerson(
    branchId,
    familyId,
    personId
) {

    const branch = album[branchId];

    if (!branch) return;


    const family = branch.families.find(
        item => item.id === familyId
    );

    if (!family) return;


    const person = family.people.find(
        item => item.id === personId
    );

    if (!person) return;


    const content = document.getElementById(
        "personContent"
    );

    if (!content) return;


    let html = `<div class="photos">`;


    person.photos.forEach((photo, index) => {


        const discovered = isPhotoDiscovered(
            branchId,
            familyId,
            person.id,
            index
        );


        /* ====================================================
           PHOTO DECOUVERTE
        ==================================================== */

        if (discovered) {

            html += `

                <div class="photo-card">

                    <img
                        class="revealed-image"
                        src="${PHOTO_FOLDER}${photo[1]}"
                        alt="${photo[0]}"
                        draggable="false"
                        onerror="imageError(this)"
                    >

                    <div class="photo-name">
                        ${index + 1}. ${photo[0]}
                    </div>

                </div>

            `;

        }


        /* ====================================================
           PHOTO VERROUILLEE

           IMPORTANT :

           Il n'y a AUCUN onclick ici.

           La photo ne peut donc PAS être découverte
           en cliquant dessus.
        ==================================================== */

        else {

            html += `

                <div class="photo-card">

                    <div class="discover-card">

                        <div class="discover-inner">

                            <div class="discover-icon">
                                🔒
                            </div>

                            <div class="discover-text">
                                Photo à découvrir
                            </div>

                        </div>

                    </div>

                    <div class="photo-name">
                        ${index + 1}. ${photo[0]}
                    </div>

                </div>

            `;

        }

    });


    html += `</div>`;


    content.innerHTML = html;


    /* ========================================================
       ONGLET ACTIF
    ======================================================== */

    document.querySelectorAll(".tab").forEach(
        button => button.classList.remove("active")
    );


    const activeTab = document.getElementById(
        "tab-" + person.id
    );


    if (activeTab) {
        activeTab.classList.add("active");
    }
}


/* ============================================================
   TRAITEMENT D'UN QR CODE PHOTO
============================================================ */

/*
   FORMAT DU QR CODE :

   #photo=branche|famille|personne|index


   Exemple :

   #photo=deniseRaymond|raymonde|philippe|0

   Cela correspond à :

   Philippe
   photo n°1
*/


function openDirectLink() {

    const hash = window.location.hash.substring(1);


    /* ========================================================
       AUCUN QR CODE
    ======================================================== */

    if (!hash) {

        showHome();

        return;
    }


    /* ========================================================
       NOUVEAU FORMAT QR PHOTO
    ======================================================== */

    if (hash.startsWith("photo=")) {

        const data = hash.substring(6);

        const parts = data.split("|");


        /*
           Nous devons avoir exactement :

           0 = branche
           1 = famille
           2 = personne
           3 = numéro photo
        */

        if (parts.length === 4) {

            const branchId = parts[0];
            const familyId = parts[1];
            const personId = parts[2];
            const photoIndex = parseInt(parts[3], 10);


            const branch = album[branchId];


            if (branch) {

                const family = branch.families.find(
                    item => item.id === familyId
                );


                if (family) {

                    const person = family.people.find(
                        item => item.id === personId
                    );


                    if (
                        person &&
                        !isNaN(photoIndex) &&
                        photoIndex >= 0 &&
                        photoIndex < person.photos.length
                    ) {

                        /*
                           LE QR CODE EST LE SEUL ELEMENT
                           QUI DEVERROUILLE LA PHOTO.
                        */

                        markPhotoDiscovered(
                            branchId,
                            familyId,
                            personId,
                            photoIndex
                        );


                        /*
                           Affiche directement la personne
                           et donc la photo scannée.
                        */

                        showFamily(
                            branchId,
                            familyId,
                            personId
                        );


                        return;
                    }
                }
            }
        }


        /*
           QR code incorrect
        */

        showHome();

        return;
    }


    /* ========================================================
       ANCIENS LIENS DE PERSONNES

       Ils restent compatibles.

       Ils ouvrent simplement la personne,
       sans débloquer de nouvelle photo.
    ======================================================== */

    const destinations = {

        "raymonde-parents":
            ["deniseRaymond", "raymonde", "raymonde-parents"],

        "philippe":
            ["deniseRaymond", "raymonde", "philippe"],

        "marie-claude-parents":
            ["deniseRaymond", "marie-claude", "marie-claude-parents"],

        "cyril":
            ["deniseRaymond", "marie-claude", "cyril"],

        "julien":

            ["deniseRaymond", "jean", "jean-parents"],

        "anne":

function imageError(image) {

    const fileName = image.getAttribute("src");


    const div = document.createElement("div");

    div.className = "image-error";


    div.innerHTML = `
        <div>
            <strong>Photo à ajouter</strong><br><br>
            ${fileName}
        </div>
    `;


    image.replaceWith(div);
}
